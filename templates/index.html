<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hybrid Health Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <h1 class="text-primary mb-3">Hybrid Health Predictor AI</h1>
        <p class="lead">Dual Disease Prediction System (Heart Disease & Diabetes)</p>
        <div class="card p-4 shadow-sm mx-auto" style="max-width: 500px;">
            <h3>Patient Health Input Form</h3>
            
            <form action="/predict" method="POST">
                <div class="mb-3 text-start mt-3">
                    <label>Age (years):</label>
                    <input type="number" name="age" class="form-control" placeholder="e.g. 45" required>
                </div>
                <div class="mb-3 text-start">
                    <label>Glucose Level (mg/dL):</label>
                    <input type="number" name="glucose" class="form-control" placeholder="e.g. 120" required>
                </div>
                <div class="mb-3 text-start">
                    <label>Blood Pressure (mmHg):</label>
                    <input type="number" name="bp" class="form-control" placeholder="e.g. 80" required>
                </div>
                <div class="mb-3 text-start">
                    <label>Cholesterol Level (mg/dL):</label>
                    <input type="number" name="cholesterol" class="form-control" placeholder="e.g. 200" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Predict Results</button>
            </form>

        </div>
    </div>
</body>
</html>
