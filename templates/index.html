<!DOCTYPEhtml>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Health Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-card {
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background: #ffffff;
        }
        .title-heading {
            color: #1a365d;
            font-weight: 700;
            font-size: 1.8rem;
        }
        .subtitle-badge {
            background-color: #e2e8f0;
            color: #2d3748;
            font-size: 0.9rem;
            border-radius: 20px;
            padding: 6px 16px;
            display: inline-block;
        }
        .btn-custom {
            background: linear-gradient(90deg, #2b6cb0 0%, #319795 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container py-5 text-center">
        <!-- Exact Registered Project Title -->
        <h1 class="title-heading mb-3 px-2">
            Hybrid Multitasking Heart Disease and Diabetic Disease Preventive Healthcare
        </h1>
        
        <p class="subtitle-badge mb-4">
            🩺 Early Detection & Multi-Risk Assessment System
        </p>
        
        <div class="card main-card p-4 mx-auto" style="max-width: 520px;">
            <h3 class="h4 text-secondary mb-4">Patient Health Input Form 📋</h3>
            
            <form action="/predict" method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label font-weight-bold">Age (years):</label>
                    <input type="number" name="age" class="form-control" placeholder="e.g. 45" required>
                </div>
                
                <div class="mb-3 text-start">
                    <label class="form-label">Glucose Level (mg/dL):</label>
                    <input type="number" name="glucose" class="form-control" placeholder="e.g. 120" required>
                </div>
                
                <div class="mb-3 text-start">
                    <label class="form-label">Blood Pressure (mmHg):</label>
                    <input type="number" name="bp" class="form-control" placeholder="e.g. 80" required>
                </div>
                
                <div class="mb-3 text-start">
                    <label class="form-label">Cholesterol Level (mg/dL):</label>
                    <input type="number" name="cholesterol" class="form-control" placeholder="e.g. 200" required>
                </div>
                
                <button type="submit" class="btn btn-custom w-100 mt-2">
                    🔍 Predict Assessment Results
                </button>
            </form>
        </div>
    </div>
</body>
</html>
